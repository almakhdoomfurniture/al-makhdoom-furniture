<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Al-Makhdoom Furniture House</title>
<style>
:root{--g:#082d25;--gold:#d4af37;--cream:#f7f3e8}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Arial,sans-serif;color:#17201d}.top{background:var(--g);color:#fff;padding:18px}.wrap{max-width:900px;margin:auto;padding:22px 16px}.panel{background:#fff;padding:22px;border-radius:12px;box-shadow:0 6px 20px #0001;margin-bottom:20px}h1,h2{color:var(--g)}input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccc;border-radius:6px;font-size:15px}button{padding:11px 16px;border:0;border-radius:6px;background:var(--g);color:#fff;font-weight:700;cursor:pointer}button.gold{background:var(--gold);color:#111}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center;border-top:1px solid #eee;padding:14px 0}.product img{width:90px;height:70px;object-fit:cover;border-radius:7px}.muted{color:#667}.danger{background:#a22}.hidden{display:none}.msg{padding:10px;border-radius:6px;background:#f1f1f1;margin:10px 0}@media(max-width:650px){.row{grid-template-columns:1fr}.product{grid-template-columns:70px 1fr}.product button{grid-column:2}}
</style></head>
<body>
<div class="top"><div class="wrap" style="padding:0"><b>AL-MAKHDOOM FURNITURE HOUSE</b> — Admin Panel</div></div>
<div class="wrap">
<div id="login" class="panel"><h2>Admin Login</h2><p class="muted">Use the admin email/password you created in Supabase Authentication.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="loginMsg"></div></div>
<div id="app" class="hidden">
<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>Products</h2><button onclick="logout()">Logout</button></div><p class="muted">Add, edit or delete products. Changes appear on the public website after saving.</p></div>
<div class="panel"><h2 id="formTitle">Add Product</h2><input id="name" placeholder="Product name e.g. Luxury Bedroom Set"><div class="row"><input id="category" placeholder="Category e.g. Bedroom"><input id="price" placeholder="Price e.g. 85000"></div><textarea id="description" rows="4" placeholder="Product description"></textarea><label>Product photo</label><input id="photo" type="file" accept="image/*"><input id="imageUrl" placeholder="Or paste an image URL (optional)"><div><button class="gold" onclick="saveProduct()">Save Product</button> <button onclick="resetForm()">Clear</button></div><div id="formMsg"></div></div>
<div class="panel"><h2>Current Products</h2><div id="list">Loading...</div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="PASTE_SUPABASE_URL_HERE", SUPABASE_KEY="PASTE_SUPABASE_PUBLISHABLE_KEY_HERE";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let editingId=null;
const $=id=>document.getElementById(id);
async function login(){const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("loginMsg").textContent=error?error.message:"Logged in";if(!error)showApp()}
async function logout(){await sb.auth.signOut();location.reload()}
async function showApp(){ $("login").classList.add("hidden");$("app").classList.remove("hidden");loadProducts() }
async function loadProducts(){const {data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});if(error){$("list").textContent=error.message;return} $("list").innerHTML=(data||[]).map(p=>`<div class="product"><img src="${p.image_url}" alt=""><div><b>${esc(p.name)}</b><div class="muted">${esc(p.category||"")} ${p.price?"• Rs. "+esc(p.price):""}</div><small>${esc(p.description||"")}</small></div><div><button onclick='editProduct(${JSON.stringify(p)})'>Edit</button> <button class="danger" onclick="deleteProduct('${p.id}')">Delete</button></div></div>`).join("")||"<p>No products yet.</p>"}
function editProduct(p){editingId=p.id;$("formTitle").textContent="Edit Product";$("name").value=p.name;$("category").value=p.category||"";$("price").value=p.price||"";$("description").value=p.description||"";$("imageUrl").value=p.image_url||"";scrollTo(0,0)}
function resetForm(){editingId=null;$("formTitle").textContent="Add Product";["name","category","price","description","imageUrl"].forEach(x=>$(x).value="");$("photo").value="";$("formMsg").textContent=""}
async function saveProduct(){const user=(await sb.auth.getUser()).data.user;if(!user){$("formMsg").textContent="Please login again.";return}let imageUrl=$("imageUrl").value.trim();const file=$("photo").files[0];if(file){const ext=file.name.split(".").pop().toLowerCase();const path=crypto.randomUUID()+"."+ext;const up=await sb.storage.from("product-images").upload(path,file,{upsert:true});if(up.error){$("formMsg").textContent=up.error.message;return}imageUrl=sb.storage.from("product-images").getPublicUrl(path).data.publicUrl}if(!imageUrl){$("formMsg").textContent="Please upload a photo or paste an image URL.";return}const payload={name:$("name").value.trim(),category:$("category").value.trim(),price:$("price").value.trim(),description:$("description").value.trim(),image_url:imageUrl,active:true};let res=editingId?await sb.from("products").update(payload).eq("id",editingId):await sb.from("products").insert(payload);$("formMsg").textContent=res.error?res.error.message:"Saved successfully!";if(!res.error){resetForm();loadProducts()}}
async function deleteProduct(id){if(!confirm("Delete this product?"))return;const {error}=await sb.from("products").delete().eq("id",id);if(error)alert(error.message);loadProducts()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
sb.auth.getSession().then(({data})=>{if(data.session)showApp()});
</script></body></html>
